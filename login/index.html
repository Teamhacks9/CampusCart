<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login · Campus Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: linear-gradient(165deg, #f8f6f3 0%, #f0ece6 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: #ffffff;
            border-radius: 32px;
            padding: 48px 40px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-header .brand-logo {
            display: inline-block;
            width: 48px;
            height: 48px;
            background: #f97316;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            margin-bottom: 12px;
        }

        .login-header h1 {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: 1.8rem;
            color: #1a1a2e;
        }

        .login-header h1 span {
            color: #f97316;
        }

        .login-header p {
            color: #4a4a6a;
            font-size: 0.95rem;
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            color: #1a1a2e;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e8e6e1;
            border-radius: 12px;
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.3s;
            background: #f8f6f3;
        }

        .form-group input:focus {
            outline: none;
            border-color: #f97316;
            background: #ffffff;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            font-size: 0.85rem;
        }

        .form-options label {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #4a4a6a;
            cursor: pointer;
        }

        .form-options a {
            color: #f97316;
            text-decoration: none;
            font-weight: 600;
        }

        .form-options a:hover {
            text-decoration: underline;
        }

        .btn-login-submit {
            width: 100%;
            padding: 14px;
            background: #f97316;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
        }

        .btn-login-submit:hover {
            background: #ea580c;
        }

        .btn-login-submit:active {
            transform: scale(0.97);
        }

        .login-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 0.9rem;
            color: #4a4a6a;
        }

        .login-footer a {
            color: #f97316;
            font-weight: 600;
            text-decoration: none;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }

        .back-home {
            display: inline-block;
            margin-top: 16px;
            color: #4a4a6a;
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.3s;
        }

        .back-home:hover {
            color: #f97316;
        }

        .demo-credentials {
            background: #f8f6f3;
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 20px;
            font-size: 0.8rem;
            color: #4a4a6a;
            border: 1px dashed #e8e6e1;
        }

        .demo-credentials strong {
            color: #1a1a2e;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 32px 24px;
            }

            .login-header h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div style="display:flex; justify-content:center;">
                <div class="brand-logo">🛍️</div>
            </div>
            <h1>Campus<span>Store</span></h1>
            <p>Sign in to your account</p>
        </div>

        <div class="demo-credentials">
            <strong>📝 Demo Credentials</strong><br />
            Email: <strong>student@campus.edu</strong><br />
            Password: <strong>password123</strong>
        </div>

        <form id="loginForm" onsubmit="return handleLogin(event)">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="student@campus.edu" value="student@campus.edu" required />
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" value="password123" required />
            </div>
            <div class="form-options">
                <label>
                    <input type="checkbox" checked /> Remember me
                </label>
                <a href="#">Forgot password?</a>
            </div>
            <button type="submit" class="btn-login-submit">Sign In →</button>
        </form>

        <div class="login-footer">
            Don't have an account? <a href="#">Sign up</a>
            <br />
            <a href="index.html" class="back-home">← Back to Home</a>
        </div>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (email && password) {
                alert('✅ Welcome back! You have successfully logged in.\n\nEmail: ' + email);
                // Redirect to dashboard or home page after login
                // window.location.href = 'dashboard.html';
                return false;
            } else {
                alert('Please fill in all fields.');
                return false;
            }
        }
    </script>
</body>
</html>
